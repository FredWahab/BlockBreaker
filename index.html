
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101827" />

  <title>Block Breaker</title>

  <meta
    name="description"
    content="Play Block Breaker, a 30-level browser arcade game featuring special bricks, power-ups, moving obstacles, high scores, and classic paddle-and-ball gameplay. Created by Fred Wahab."
  />

  <meta name="author" content="Fred Wahab" />
  <meta name="robots" content="index, follow" />

  <link
    rel="icon"
    type="image/svg+xml"
    href="./favicon.svg"
  />
</head>

<body>
  <main class="game-container">

    <header class="game-header">
      <div class="game-heading">
        <h1>BLOCK BREAKER</h1>
        <p>ARCADE EDITION</p>
      </div>
    </header>

    <section
      class="game-panel"
      aria-label="Block Breaker arcade game"
    >
      <canvas
        id="gameCanvas"
        width="800"
        height="600"
        tabindex="0"
        aria-label="Block Breaker. Move the paddle to keep the ball in play and destroy all bricks. Pause the game for controls and instructions."
      ></canvas>

      <div class="game-controls" aria-label="Game controls">

        <button
          id="pauseButton"
          type="button"
          aria-label="Pause or resume the game"
        >
          Pause
        </button>

        <button
          id="soundButton"
          type="button"
          aria-label="Toggle game sound"
        >
          Sound: On
        </button>

        <button
          id="highScoresButton"
          type="button"
          aria-label="View arcade high scores"
        >
          High Scores
        </button>

        <button
          id="restartButton"
          type="button"
          aria-label="Restart the game"
        >
          Restart
        </button>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    Made by
    <a
      href="https://fredwahab.com"
      target="_blank"
      rel="noopener noreferrer"
    >fredwahab.com</a>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
